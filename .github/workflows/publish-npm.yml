name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify committed runtime bundles
        run: |
          npm run build:runtime
          git diff --exit-code -- lib/runtime

      - name: Build Rhine UI
        run: npm run build:rhine

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Verify packed runtime without installed dependencies
        run: |
          package_dir="$(mktemp -d)"
          npm pack --pack-destination "$package_dir" --json > "$package_dir/pack.json"
          node --input-type=module - "$package_dir" <<'JS'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { execFileSync } from 'node:child_process'
          const directory = process.argv[2]
          const packed = JSON.parse(readFileSync(join(directory, 'pack.json'), 'utf8'))[0]
          const files = packed.files.map(file => file.path)
          for (const required of ['src/index.js', 'lib/client.js', 'cordis.patch.yml', 'presets/register.js', 'bin/install.js', 'contracts/cloud_tools_v1.schema.json', 'lib/runtime/yaml.js', 'lib/runtime/zod.js', 'lib/runtime/versions.json', 'lib/runtime/licenses/js-yaml-MIT.txt', 'lib/runtime/licenses/zod-MIT.txt']) {
            if (!files.includes(required)) throw new Error('missing from package: ' + required)
          }
          execFileSync('tar', ['-xzf', join(directory, packed.filename), '-C', directory])
          execFileSync(process.execPath, ['bin/check-runtime.mjs', '--package', join(directory, 'package')], { stdio: 'inherit' })
          JS

      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          # Ignore build metadata when detecting semver prereleases.
          if [[ "${version%%+*}" == *-* || "$RELEASE_PRERELEASE" == "true" ]]; then
            tag=next
          else
            tag=latest
          fi
          npm publish --provenance --access public --tag "$tag"
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
